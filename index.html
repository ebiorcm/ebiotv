<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リダイレクト中..</title>
    <style>
        body {
            text-align: center;
            margin: 0;
            padding-top: 20px;
        }

        /* 広告枠をCSSで拡大 */
        .ad-container {
            display: inline-block;
            transform: scale(2);
            transform-origin: top center;
            margin-top: 20px;
        }

        /* 右上の「x」ボタン */
        .close-btn {
            position: fixed;
            top: 15px;
            right: 20px;
            width: 40px;
            height: 40px;
            line-height: 36px;
            font-size: 24px;
            font-family: Arial, sans-serif;
            text-align: center;
            text-decoration: none;
            border: 2px solid #333333;
            color: #333333;
            background-color: #ffffff;
            border-radius: 50%;
            font-weight: bold;
            transition: all 0.3s;
            z-index: 9999;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .close-btn:hover {
            background-color: #333333;
            color: #ffffff;
            cursor: pointer;
        }

        .close-btn.disabled {
            border-color: #999999;
            color: #999999;
            cursor: not-allowed;
            background-color: #f0f0f0;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <img src="ebio.png" alt="logo"><br>

    <!-- 右上の x ボタン -->
    <a href="javascript:void(0);" id="redirect-btn" class="close-btn" title="閉じる">×</a>

    <!-- 広告エリア -->
    <div class="ad-container">
        <!-- admax -->
        <script src="https://adm.shinobi.jp/s/9032fb76d0a4a05e27cb7ca7e9c0eb17"></script>
        <!-- admax -->
    </div>

    <script>
    window.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('redirect-btn');
        
        const urlParams = new URLSearchParams(window.location.search);
        const urlIndex = parseInt(urlParams.get('url'), 10);

        if (isNaN(urlIndex) || urlIndex < 1) {
            btn.classList.add('disabled');
            return;
        }

        fetch('list.txt')
            .then(response => {
                if (!response.ok) throw new Error();
                return response.text();
            })
            .then(text => {
                const lines = text.split(/\r?\n/);
                const targetUrl = lines[urlIndex - 1];

                if (targetUrl && targetUrl.trim().startsWith('http')) {
                    // href属性に直接URLをセット
                    btn.href = targetUrl.trim();
                } else {
                    btn.classList.add('disabled');
                }
            })
            .catch(() => {
                btn.classList.add('disabled');
            });

        // ボタンクリック時に確認ダイアログを表示
        btn.addEventListener('click', (e) => {
            if (btn.classList.contains('disabled')) {
                e.preventDefault();
                alert("有効なURLが指定されていません。");
                return;
            }

            const warningMessage = "【注意】\nこのサイトはリンク先の安全を保障するものではありません。\nリンク先のいかなる問題も、運営者は負いません。\n\n移動しますか？";
            
            // 「キャンセル」を押した場合は移動をキャンセル
            if (!confirm(warningMessage)) {
                e.preventDefault();
            }
        });
    });
    </script>
</body>
</html>
