<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>リダイレクト中..</title>
    <style>
        body {
            text-align: center;
            margin: 0;
            padding-top: 20px;
        }

        /* 広告枠をCSSで拡大 */
        .ad-container {
            display: inline-block;
            transform: scale(2);
            transform-origin: top center;
            margin-top: 20px;
        }

        /* 右上の「x」ボタン */
        .close-btn {
            position: fixed;
            top: 15px;
            right: 20px;
            width: 40px;
            height: 40px;
            line-height: 36px;
            font-size: 18px; /* カウントダウン表示用に少し小さく調整 */
            font-family: Arial, sans-serif;
            text-align: center;
            text-decoration: none;
            border: 2px solid #333333;
            color: #333333;
            background-color: #ffffff;
            border-radius: 50%;
            font-weight: bold;
            transition: all 0.3s;
            z-index: 9999;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .close-btn:not(.disabled):hover {
            background-color: #333333;
            color: #ffffff;
            cursor: pointer;
        }

        /* カウントダウン中・無効化時のスタイル */
        .close-btn.disabled {
            border-color: #cccccc;
            color: #999999;
            cursor: not-allowed;
            background-color: #f0f0f0;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <img src="ebio.png" alt="logo"><br>

    <!-- 右上の x ボタン（初期値はカウントダウン用） -->
    <a href="javascript:void(0);" id="redirect-btn" class="close-btn disabled" title="お待ちください">3</a>

    <!-- 広告エリア -->
    <div class="ad-container">
        <!-- admax -->
        <script src="https://adm.shinobi.jp/s/9032fb76d0a4a05e27cb7ca7e9c0eb17"></script>
        <!-- admax -->
    </div>

    <script>
    window.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('redirect-btn');
        let destinationUrl = "";
        let isTimerFinished = false;

        const urlParams = new URLSearchParams(window.location.search);
        const urlIndex = parseInt(urlParams.get('url'), 10);

        // 1. URL情報の取得処理
        if (!isNaN(urlIndex) && urlIndex >= 1) {
            fetch('list.txt')
                .then(response => {
                    if (!response.ok) throw new Error();
                    return response.text();
                })
                .then(text => {
                    const lines = text.split(/\r?\n/);
                    const targetUrl = lines[urlIndex - 1];

                    if (targetUrl && targetUrl.trim().startsWith('http')) {
                        destinationUrl = targetUrl.trim();
                        // タイマーがすでに終わっていればhrefをセット
                        if (isTimerFinished) {
                            btn.href = destinationUrl;
                            btn.classList.remove('disabled');
                        }
                    }
                })
                .catch(() => {});
        }

        // 2. 3秒のカウントダウンタイマー
        let countdown = 3;
        const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                btn.innerText = countdown;
            } else {
                clearInterval(timer);
                isTimerFinished = true;
                
                // URL取得が成功していればボタンを有効化
                if (destinationUrl) {
                    btn.innerText = "×";
                    btn.style.fontSize = "24px";
                    btn.href = destinationUrl;
                    btn.classList.remove('disabled');
                    btn.title = "閉じる";
                } else {
                    btn.innerText = "×";
                    btn.title = "有効なURLがありません";
                }
            }
        }, 1000);

        // 3. クリック時処理
        btn.addEventListener('click', (e) => {
            if (btn.classList.contains('disabled') || !isTimerFinished) {
                e.preventDefault();
                return;
            }

            const warningMessage = "【注意】\nこのサイトはリンク先の安全を保障するものではありません。\nリンク先のいかなる問題も、運営者は負いません。\n\n移動しますか？";
            
            if (!confirm(warningMessage)) {
                e.preventDefault();
            }
        });
    });
    </script>
</body>
</html>
